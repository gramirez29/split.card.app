name: split.card.mobile CI

on:
  push:
    paths:
      - "split.card.mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "split.card.mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: split.card.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: split.card.mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
