name: split.card.service CI

on:
  push:
    paths:
      - "split.card.service/**"
      - ".github/workflows/service-ci.yml"
  pull_request:
    paths:
      - "split.card.service/**"
      - ".github/workflows/service-ci.yml"

concurrency:
  group: split.card.service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: split.card.service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  deploy:
    name: Deploy to Railway
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: develop
    defaults:
      run:
        working-directory: split.card.service
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not configured for the develop environment. Skipping deploy."
            exit 0
          fi

          if [ -n "$RAILWAY_SERVICE_NAME" ]; then
            railway up --service "$RAILWAY_SERVICE_NAME" --detach --ci
          else
            railway up --detach --ci
          fi
